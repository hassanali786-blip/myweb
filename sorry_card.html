<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Friend Card</title>
    <style>
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: #ffffff;
            width: 360px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            border-top: 6px solid #ff4b2b;
        }
        .heart-icon {
            font-size: 50px;
            color: #ff4b2b;
            margin-bottom: 10px;
        }
        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .poetry {
            background: #fff5f5;
            padding: 15px;
            border-radius: 12px;
            color: #c0392b;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.8;
            margin-bottom: 20px;
            border-left: 4px solid #ff4b2b;
        }
        .footer-text {
            font-size: 13px;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart-icon">❤️</div>
        <h2>I am Really Sorry!</h2>
        
        <div class="poetry">
            kisi ki narazgi se darr lagta hai,<br>
            dost bina har rasta adhoora lagta hai!
        </div>

        <p>
            Mujse agar koi galti ho gayi ho toh dil se maazrat. Aapse baat kiye bina din adhoora lagta hai. Wapis pehle ki tarah baat kar lein!
        </p>

        <div class="footer-text">
            Best Friends Forever ✨
        </div>
    </div>

</body>
</html>
