<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message for Fatima ✨</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Background */
        .heart {
            position: absolute;
            color: #ff4757;
            font-size: 20px;
            animation: float 6s infinite ease-in-out;
            opacity: 0.6;
        }
        @keyframes float {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }

        /* Main Card Container */
        .card {
            background: rgba(255, 255, 255, 0.07);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 10;
        }

        .avatar {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        h1 {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .name {
            color: #ff6b81;
            font-size: 2.2rem;
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 107, 129, 0.5);
        }

        .message {
            font-size: 1rem;
            color: #dcdde1;
            line-height: 1.6;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
            border-left: 3px solid #ff6b81;
        }

        /* Buttons Section */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: #dcdde1;
        }

        /* Celebration Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #2a2a40;
            padding: 25px;
            border-radius: 18px;
            max-width: 300px;
            width: 80%;
            text-align: center;
            border: 1px solid #ff6b81;
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div class="heart" style="left: 15%; animation-delay: 0s;">💖</div>
    <div class="heart" style="left: 35%; animation-delay: 2s;">✨</div>
    <div class="heart" style="left: 65%; animation-delay: 4s;">🌸</div>
    <div class="heart" style="left: 85%; animation-delay: 1s;">🎵</div>

    <!-- Main Card Body -->
    <div class="card">
        <div class="avatar">🎙️✨</div>
        <h1>Hey There,</h1>
        <span class="name">Fatima!</span>

        <div class="message">
            I heard your voice on Instagram yesterday and honestly, it was so incredibly sweet & graceful! 🌟<br><br>
            I'd really love to be good friends with you. What do you say? 😊
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="acceptFriendship()">Let's Be Friends! 🤝</button>
            <button class="btn btn-secondary" onclick="maybeLater()">Maybe Later 😄</button>
        </div>
    </div>

    <!-- Celebration Popup -->
    <div class="modal" id="celebrateModal">
        <div class="modal-content">
            <div style="font-size: 3rem; margin-bottom: 10px;">🎉✨</div>
            <h2 style="color: #ff6b81; margin-bottom: 10px;">Awesome!</h2>
            <p style="font-size: 0.95rem; color: #dcdde1; margin-bottom: 15px;">
                Looking forward to great conversations and a nice friendship! 💬🌸
            </p>
            <button class="btn btn-primary" onclick="closeModal()">Yay! 😊</button>
        </div>
    </div>

    <script>
        function acceptFriendship() {
            document.getElementById('celebrateModal').style.display = 'flex';
        }

        function maybeLater() {
            alert("No worries at all! Just wanted to compliment your amazing voice. Have a great day! ✨");
        }

        function closeModal() {
            document.getElementById('celebrateModal').style.display = 'none';
        }
    </script>
</body>
</html>
