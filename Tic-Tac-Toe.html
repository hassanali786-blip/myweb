 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .game-card { position: relative; width: 320px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .cell { width: 85px; height: 85px; background: #2a2a2a; font-size: 2.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; border: 1px solid #444; }
        .cell:active { background: #333; }
        .btn { padding: 8px 16px; font-size: 0.9rem; background: #2196F3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .popup { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; }
        .popup h2 { color: #2196F3; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="game-card">
    <div class="controls">
        <span id="status">Turn: X</span>
        <button class="btn" onclick="resetGame()">Reset</button>
    </div>

    <div class="board" id="board"></div>

    <div id="welcomeModal" class="popup">
        <h2>Tic-Tac-Toe</h2>
        <p style="margin-bottom: 15px;">2 Player Mode</p>
        <button class="btn" onclick="startGame()">Start Game</button>
    </div>

    <div id="winModal" class="popup" style="display: none;">
        <h2 id="winText">Player X Wins!</h2>
        <button class="btn" onclick="resetGame()" style="margin-top: 15px;">Play Again</button>
    </div>
</div>

<script>
    const board = document.getElementById('board');
    let turn = 'X', cells = Array(9).fill(null), gameActive = false;

    function startGame() {
        document.getElementById('welcomeModal').style.display = 'none';
        resetGame();
    }

    function initBoard() {
        board.innerHTML = '';
        cells.forEach((val, i) => {
            const btn = document.createElement('div');
            btn.className = 'cell';
            btn.innerText = val || '';
            btn.onclick = () => play(i);
            board.appendChild(btn);
        });
    }

    function play(i) {
        if (!gameActive || cells[i]) return;
        cells[i] = turn;
        initBoard();
        if (checkWin()) {
            document.getElementById('winText').innerText = `Player ${turn} Wins!`;
            document.getElementById('winModal').style.display = 'flex';
            gameActive = false;
            return;
        }
        if (!cells.includes(null)) {
            document.getElementById('winText').innerText = "Match Draw!";
            document.getElementById('winModal').style.display = 'flex';
            gameActive = false;
            return;
        }
        turn = turn === 'X' ? 'O' : 'X';
        document.getElementById('status').innerText = `Turn: ${turn}`;
    }

    function checkWin() {
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        return wins.some(([a,b,c]) => cells[a] && cells[a] === cells[b] && cells[a] === cells[c]);
    }

    function resetGame() {
        cells = Array(9).fill(null);
        turn = 'X';
        gameActive = true;
        document.getElementById('status').innerText = `Turn: ${turn}`;
        document.getElementById('winModal').style.display = 'none';
        initBoard();
    }
    initBoard();
</script>
</body>
</html>
