<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Fatima! 🎉</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Floating Background Balloons */
        .balloon {
            position: absolute;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            bottom: -100px;
            animation: float 8s infinite ease-in-out;
            opacity: 0.7;
            z-index: 1;
        }
        .b1 { background: #ff4757; left: 10%; animation-delay: 0s; }
        .b2 { background: #2ed573; left: 25%; animation-delay: 2s; }
        .b3 { background: #ffa502; left: 60%; animation-delay: 4s; }
        .b4 { background: #1e90ff; left: 80%; animation-delay: 1s; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
        }

        /* Main Card Container */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 420px;
            width: 90%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.8);
        }

        h1 {
            color: #d63031;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .name {
            color: #e84393;
            font-size: 2.8rem;
            font-weight: bold;
            display: block;
            margin: 10px 0;
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 5px #e84393, 0 0 10px #e84393; }
            to { text-shadow: 0 0 15px #ff7675, 0 0 25px #ff7675; }
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Interactive Surprise Gift Button */
        .gift-btn {
            background: #e84393;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(232, 67, 147, 0.4);
            transition: transform 0.2s, background 0.2s;
            margin-top: 10px;
        }
        .gift-btn:hover {
            transform: scale(1.05);
            background: #d63031;
        }

        /* Music Controls */
        .music-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #ddd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* Surprise Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 320px;
            width: 80%;
            text-align: center;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Background Music (Royal Royalty Free Happy Birthday Tune) -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73539.mp3?filename=happy-birthday-155461.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Background Balloons -->
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <!-- Main Card Body -->
    <div class="card">
        <button class="music-btn" onclick="toggleMusic()" id="musicBtn" title="Play/Pause Music">🎵</button>
        
        <div style="font-size: 3rem; margin-bottom: 5px;">🎂</div>
        <h1>Happy Birthday</h1>
        <span class="name">Fatima!</span>

        <p>May your day be filled with lots of happiness, sweet smiles, laughter, and beautiful memories! ✨🎁</p>

        <button class="gift-btn" onclick="openSurprise()">Click for Surprise 🎁</button>
    </div>

    <!-- Surprise Popup Modal -->
    <div class="modal" id="surpriseModal">
        <div class="modal-content">
            <h2 style="color: #e84393; margin-bottom: 10px;">🎉 Happy Birthday! 🎉</h2>
            <p style="font-size: 1rem; color: #333;">A very Special Wish for a very Special Person! Always keep smiling and shining Fatima! 🌟✨</p>
            <button class="gift-btn" style="padding: 8px 20px; font-size: 0.9rem;" onclick="closeSurprise()">Close</button>
        </div>
    </div>

    <script>
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        let isPlaying = false;

        // Auto-play / Music Toggle Logic
        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = '🔇';
            } else {
                music.play().then(() => {
                    musicBtn.innerText = '🎵';
                }).catch(() => {
                    alert("Please click anywhere on screen to enable audio!");
                });
            }
            isPlaying = !isPlaying;
        }

        // Screen tap anywhere triggers music on first load
        document.body.addEventListener('click', function firstClick() {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerText = '🎵';
                }).catch(() => {});
            }
            document.body.removeEventListener('click', firstClick);
        }, { once: true });

        // Surprise Popup Logic
        function openSurprise() {
            document.getElementById('surpriseModal').style.display = 'flex';
        }

        function closeSurprise() {
            document.getElementById('surpriseModal').style.display = 'none';
        }
    </script>
</body>
</html>
