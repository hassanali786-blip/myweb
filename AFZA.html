<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I am Sorry Azfa ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Background */
        .heart-bg {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: float 6s linear infinite;
            font-size: 20px;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Card Layout */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .emoji {
            font-size: 60px;
            margin-bottom: 15px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        p {
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-forgive {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }

        .btn-forgive:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.6);
        }

        .btn-no {
            background: #e2e8f0;
            color: #64748b;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            color: #ff4757;
            margin-bottom: 10px;
        }

        .modal-content p {
            color: #555;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">🥺💖</div>
        <h1>I'm So Sorry, Azfa!</h1>
        <p>Mujhse jo bhi galti hui uske liye I am really very sorry. Tumhari khushi mere liye bahut matter karti hai. Kya tum mujhe maaf kar dogi? ✨</p>
        
        <div class="btn-group">
            <button class="btn btn-forgive" onclick="forgiveMe()">Maaf Kiya ❤️</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()">Nahi 😜</button>
        </div>
    </div>

    <!-- Success Popup -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <h2>Thank You, Azfa! 🥰</h2>
            <p>Aap sabse pyari ho! Thank you itni jaldi maaf karne ke liye. ❤️✨</p>
            <button class="btn btn-forgive" onclick="closeModal()">Yay! 💖</button>
        </div>
    </div>

    <script>
        // Floating Hearts Background Generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 300);

        // Move "Nahi" button on hover
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        // Forgive Action
        function forgiveMe() {
            document.getElementById('successModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }
    </script>
</body>
</html>
